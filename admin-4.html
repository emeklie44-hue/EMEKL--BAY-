<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMEKLİBAYİ Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef4ff;font-family:Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.logo{font-size:25px;font-weight:900}.logo span{color:#5da9ff}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#1877d2;color:#fff}.danger{background:#9d3030}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.box{background:#0c1a2c;border:1px solid #244565;border-radius:18px;padding:22px;width:100%;max-width:430px}
input,select{width:100%;padding:11px;border-radius:9px;background:#081423;color:#fff;border:1px solid #284865;margin:5px 0}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:15px}.tab{white-space:nowrap;background:#0d1b2d;border:1px solid #294865;color:#bcd0e5;border-radius:10px;padding:10px 13px}.tab.active{background:#1877d2;color:#fff}
.card{background:#0c1a2c;border:1px solid #244565;border-radius:14px;padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0d1b2d;border:1px solid #244565;border-radius:13px;padding:15px}.stat b{display:block;font-size:22px;margin-top:6px}
.small{color:#91a8c0;font-size:13px}.msg{margin-top:10px;color:#ffb0b0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}.stat b{font-size:18px}}
</style>
</head>
<body>
<div id="login" class="auth"><div class="box">
<div class="logo">EMEKLİ<span>BAYİ</span> — ADMIN</div>
<h2>Admin Girişi</h2>
<input id="email" type="email" placeholder="E-posta">
<input id="password" type="password" placeholder="Şifre">
<button class="btn" style="width:100%;margin-top:8px" onclick="login()">Giriş Yap</button>
<button type="button" onclick="forgotPassword()" style="margin-top:10px;background:none;border:0;color:#5da9ff;font-weight:700;cursor:pointer">Şifremi Unuttum</button>
<div id="loginMsg" class="msg"></div>
</div></div>

<div id="panel" style="display:none"><div class="wrap">
<div class="top"><div class="logo">EMEKLİ<span>BAYİ</span> Admin</div><button class="btn danger" onclick="logout()">Çıkış</button></div>
<div class="tabs">
<button class="tab active" onclick="showTab('dashboard',this)">📊 Özet</button>
<button class="tab" onclick="showTab('deposits',this)">💰 Bakiye Talepleri</button>
<button class="tab" onclick="showTab('orders',this)">📦 Siparişler</button>
<button class="tab" onclick="showTab('users',this)">👥 Kullanıcılar</button>
<button class="tab" onclick="showTab('services',this)">🛠️ Hizmetler</button>
</div>

<section id="dashboard">
<div class="grid">
<div class="stat">Kullanıcı<b id="statUsers">-</b></div>
<div class="stat">Bekleyen Bakiye<b id="statDeposits">-</b></div>
<div class="stat">Toplam Sipariş<b id="statOrders">-</b></div>
<div class="stat">Aktif Hizmet<b id="statServices">-</b></div>
</div>
</section>
<section id="deposits" style="display:none"><div id="depositList"></div></section>
<section id="orders" style="display:none"><div id="orderList"></div></section>
<section id="users" style="display:none"><div id="userList"></div></section>
<section id="services" style="display:none"><div id="serviceList"></div></section>
</div></div>

<div id="resetModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9999;align-items:center;justify-content:center;padding:20px">
<div class="box">
<div class="logo">EMEKLİ<span>BAYİ</span> — ŞİFRE YENİLE</div>
<h2>Yeni Şifre</h2>
<input id="newPassword" type="password" placeholder="Yeni şifre">
<input id="newPassword2" type="password" placeholder="Yeni şifre tekrar">
<button class="btn" style="width:100%;margin-top:8px" onclick="updatePassword()">Şifreyi Güncelle</button>
<div id="resetMsg" class="msg"></div>
</div></div>

<script>
const SUPABASE_URL='https://iwnfgzswdqkqfixauqeg.supabase.co';
const SUPABASE_KEY='sb_publishable_u80nvmjnC4SL_Qm_fXLUZg_h3shuQlS';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function money(v){return new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(Number(v)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

async function forgotPassword(){
 const email=document.getElementById('email').value.trim();
 if(!email){
   document.getElementById('loginMsg').textContent='Önce e-posta adresini yaz.';
   return;
 }
 const {error}=await sb.auth.resetPasswordForEmail(email,{
   redirectTo:'https://emekl-bay.vercel.app/admin.html'
 });
 document.getElementById('loginMsg').textContent =
   error ? error.message : 'Şifre yenileme bağlantısı e-postana gönderildi.';
}

async function updatePassword(){
 const p1=document.getElementById('newPassword').value;
 const p2=document.getElementById('newPassword2').value;
 const msg=document.getElementById('resetMsg');

 if(p1.length<6){msg.textContent='Şifre en az 6 karakter olmalı.';return}
 if(p1!==p2){msg.textContent='Şifreler aynı değil.';return}

 const {error}=await sb.auth.updateUser({password:p1});
 msg.textContent=error ? error.message : 'Şifre güncellendi. Giriş yapabilirsin.';
 if(!error){
   setTimeout(()=>location.href='https://emekl-bay.vercel.app/admin.html',1200);
 }
}

function checkRecovery(){
 const h=window.location.hash;
 if(h.includes('type=recovery')){
   document.getElementById('login').style.display='none';
   document.getElementById('panel').style.display='none';
   document.getElementById('resetModal').style.display='flex';
 }
}

async function login(){
 const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error){loginMsg.textContent=error.message;return}
 await init();
}
async function init(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){login.style.display='flex';return}
 const {data:p,error}=await sb.from('profiles').select('role,balance').eq('id',session.user.id).single();
 if(error||p?.role!=='admin'){
   await sb.auth.signOut();
   login.style.display='flex';
   loginMsg.textContent='Bu hesap admin değil.';
   return;
 }
 login.style.display='none';panel.style.display='block';refreshAll();
}
async function logout(){await sb.auth.signOut();location.reload()}
function showTab(id,el){
 ['dashboard','deposits','orders','users','services'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');
 if(id==='deposits')loadDeposits();if(id==='orders')loadOrders();if(id==='users')loadUsers();if(id==='services')loadServices();
}
async function refreshAll(){await Promise.all([loadStats(),loadDeposits(),loadOrders(),loadUsers(),loadServices()])}
async function loadStats(){
 const [u,d,o,s]=await Promise.all([
  sb.from('profiles').select('id',{count:'exact',head:true}),
  sb.from('deposit_requests').select('id',{count:'exact',head:true}).eq('status','Bekliyor'),
  sb.from('orders').select('id',{count:'exact',head:true}),
  sb.from('services').select('id',{count:'exact',head:true}).eq('active',true)
 ]);
 statUsers.textContent=u.count??0;statDeposits.textContent=d.count??0;statOrders.textContent=o.count??0;statServices.textContent=s.count??0;
}
async function loadDeposits(){
 const {data,error}=await sb.from('deposit_requests').select('id,user_id,amount,status,created_at').order('id',{ascending:false});
 if(error){depositList.innerHTML='<div class="card">'+esc(error.message)+'</div>';return}
 depositList.innerHTML=(data||[]).map(r=>`<div class="card"><div class="row"><div><b>#${r.id} — ${money(r.amount)}</b><div class="small">Kullanıcı: ${esc(r.user_id)} · ${esc(r.status)}</div></div>${r.status==='Bekliyor'?`<button class="btn" onclick="approveDeposit(${r.id})">Onayla</button>`:''}</div></div>`).join('')||'<div class="card">Bakiye talebi yok.</div>';
}
async function approveDeposit(id){
 const {error}=await sb.rpc('approve_deposit_secure',{p_request_id:id});
 if(error){alert(error.message);return}
 await refreshAll();alert('Bakiye talebi onaylandı.');
}
async function loadOrders(){
 const {data,error}=await sb.from('orders').select('id,order_number,user_id,service_id,link,quantity,amount,status,created_at').order('id',{ascending:false}).limit(100);
 if(error){orderList.innerHTML='<div class="card">'+esc(error.message)+'</div>';return}
 orderList.innerHTML=(data||[]).map(r=>`<div class="card"><b>#${esc(r.order_number)}</b><div class="small">Kullanıcı: ${esc(r.user_id)} · Hizmet #${r.service_id} · ${r.quantity} adet · ${money(r.amount)}</div><input value="${esc(r.link)}" readonly><select onchange="changeOrder(${r.id},this.value)">${['Bekliyor','İşleme Alındı','Tamamlandı','İptal'].map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')||'<div class="card">Sipariş yok.</div>';
}
async function changeOrder(id,status){
 const {error}=await sb.from('orders').update({status}).eq('id',id);
 if(error)alert(error.message);else{await loadOrders();await loadStats()}
}
async function loadUsers(){
 const {data,error}=await sb.from('profiles').select('id,balance,role').order('balance',{ascending:false});
 if(error){userList.innerHTML='<div class="card">'+esc(error.message)+'</div>';return}
 userList.innerHTML=(data||[]).map(r=>`<div class="card"><b>${esc(r.id)}</b><div class="small">Rol: ${esc(r.role)} · Bakiye: ${money(r.balance)}</div></div>`).join('')||'<div class="card">Kullanıcı yok.</div>';
}
async function loadServices(){
 const {data,error}=await sb.from('services').select('id,platform,category,name,price_per_1000,min_quantity,max_quantity,active').order('id');
 if(error){serviceList.innerHTML='<div class="card">'+esc(error.message)+'</div>';return}
 serviceList.innerHTML=(data||[]).map(r=>`<div class="card"><div class="row"><div><b>#${r.id} ${esc(r.name)}</b><div class="small">${esc(r.platform)} · ${esc(r.category)} · ${money(r.price_per_1000)}/1000 · Min ${r.min_quantity} Max ${r.max_quantity}</div></div><button class="btn" onclick="toggleService(${r.id},${!r.active})">${r.active?'Kapat':'Aç'}</button></div></div>`).join('');
}
async function toggleService(id,active){
 const {error}=await sb.from('services').update({active}).eq('id',id);
 if(error)alert(error.message);else{await loadServices();await loadStats()}
}
init();
checkRecovery();
</script>
</body>
</html>
